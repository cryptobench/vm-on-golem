[package]
name = "golem-provider-desktop"
version = "0.1.0"
description = "Golem Provider desktop shell"
authors = ["Golem"]
edition = "2021"

[lib]
name = "golem_provider_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
