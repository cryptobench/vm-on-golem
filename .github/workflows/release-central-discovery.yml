name: Build and Release Central Discovery

on:
  pull_request:
    paths:
      - "central-discovery-server/**"
      - "scripts/update_central_discovery.sh"
      - ".github/workflows/release-central-discovery.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. central-discovery-v0.1.0"
        required: true
        type: string
      ref:
        description: "Commit SHA or branch to build"
        required: false
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "central-discovery-v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref) }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: central-discovery-server/go.sum

      - name: Test central discovery
        working-directory: central-discovery-server
        run: go test ./...

      - name: Validate updater script
        run: bash -n scripts/update_central_discovery.sh

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref) }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: central-discovery-server/go.sum

      - name: Build release binary
        shell: bash
        working-directory: central-discovery-server
        run: |
          set -euo pipefail
          package_dir="dist/golem-central-discovery-${{ matrix.target }}"
          mkdir -p "$package_dir"
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -ldflags="-s -w" \
            -o "$package_dir/golem-central-discovery" \
            ./cmd/golem-central-discovery
          tar -C dist -czf "dist/golem-central-discovery-${{ matrix.target }}.tar.gz" \
            "golem-central-discovery-${{ matrix.target }}"

      - name: Upload central discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: golem-central-discovery-${{ matrix.target }}
          path: central-discovery-server/dist/golem-central-discovery-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref) }}

      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            central-discovery-v*) ;;
            *) echo "Release tag must match central-discovery-v*" >&2; exit 1 ;;
          esac
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION=${tag#central-discovery-v}" >> "$GITHUB_OUTPUT"

      - name: Download central discovery artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: golem-central-discovery-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          sha256sum golem-central-discovery-*.tar.gz | sort -k2 > checksums.txt
          {
            echo "### Central discovery release assets"
            sed 's#^#- #' checksums.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: Central Discovery ${{ steps.meta.outputs.VERSION }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
