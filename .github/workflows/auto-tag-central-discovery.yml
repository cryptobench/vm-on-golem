name: Auto Tag Central Discovery

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump type (patch|minor|major)"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
  push:
    branches: [main]
    paths:
      - "central-discovery-server/**"
      - "scripts/update_central_discovery.sh"
      - ".github/workflows/release-central-discovery.yml"
      - ".github/workflows/auto-tag-central-discovery.yml"

jobs:
  tag:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          release_type="${RELEASE_TYPE:-patch}"
          latest="$(git tag --list 'central-discovery-v*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            version="0.1.0"
          else
            version="${latest#central-discovery-v}"
            IFS=. read -r major minor patch <<< "$version"
            major="${major:-0}"
            minor="${minor:-0}"
            patch="${patch:-0}"
            case "$release_type" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unsupported release_type: $release_type" >&2; exit 1 ;;
            esac
            version="$major.$minor.$patch"
          fi
          tag="central-discovery-v$version"
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'patch' }}

      - name: Configure git user
        run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name "GitHub Actions"

      - name: Create and push tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.TAG }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -a "$tag" -m "Central Discovery ${{ steps.meta.outputs.VERSION }}"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch release workflow
        if: steps.tag.outputs.created == 'true'
        run: |
          tag="${{ steps.meta.outputs.TAG }}"
          gh workflow run release-central-discovery.yml --ref "$tag" -f tag="$tag"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
