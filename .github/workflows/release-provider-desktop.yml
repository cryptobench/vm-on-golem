name: Build and Release Provider Desktop

on:
  pull_request:
    paths:
      - "apps/provider-desktop/**"
      - "packages/design-system/**"
      - "packages/ui/**"
      - "packages/prices/**"
      - "provider-server/**"
      - "install/provider-cli.sh"
      - "install/provider-cli.ps1"
      - "scripts/build_provider_cli.py"
      - "scripts/vendor_multipass.py"
      - "scripts/package_provider_desktop_macos.py"
      - ".github/workflows/auto-tag-provider-desktop.yml"
      - ".github/workflows/release-provider-desktop.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or ref to build (e.g., provider-desktop-v0.1.0)"
        required: false
        type: string
      ref:
        description: "Commit SHA or branch to build if no tag provided"
        required: false
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "provider-desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            cli-target: linux-x86_64
            multipass-platform: linux
            multipass-arch: x86_64
          - os: macos-14
            target: mac-arm64
            cli-target: macos-arm64
            multipass-platform: darwin
            multipass-arch: aarch64
          - os: windows-latest
            target: win
            cli-target: windows-x86_64
            multipass-platform: windows
            multipass-arch: x86_64

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || (github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref)) }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        if: ${{ runner.os != 'Linux' }}
        run: python -m pip install --upgrade pip poetry

      - name: Install provider dependencies
        if: ${{ runner.os != 'Linux' }}
        run: poetry -C provider-server install --no-interaction --no-ansi

      - name: Install PyInstaller
        if: ${{ runner.os != 'Linux' }}
        run: poetry -C provider-server run pip install pyinstaller

      - name: Build Linux provider sidecar in manylinux
        if: ${{ matrix.cli-target == 'linux-x86_64' }}
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -lc '
              set -euo pipefail
              PY=/opt/python/cp311-cp311/bin/python
              "$PY" -m pip install --upgrade pip poetry
              "$PY" -m poetry -C provider-server install --no-interaction --no-ansi
              "$PY" -m poetry -C provider-server run pip install pyinstaller
              "$PY" -m poetry -C provider-server run python ../scripts/build_provider_cli.py --onefile --release-dir ../provider-cli-release-assets --release-target linux-x86_64 --tauri-target-triple x86_64-unknown-linux-gnu
            '
          for path in provider-cli-release-assets apps/provider-desktop/src-tauri/binaries dist build; do
            [ ! -e "$path" ] || sudo chown -R "$USER:$USER" "$path"
          done

      - name: Build and stage provider sidecar
        if: ${{ runner.os != 'Linux' }}
        run: poetry -C provider-server run python ../scripts/build_provider_cli.py --onefile --release-dir ../provider-cli-release-assets --release-target "${{ matrix.cli-target }}"

      - name: Upload provider CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-cli-${{ matrix.cli-target }}
          path: provider-cli-release-assets/*
          if-no-files-found: error

      - name: Vendor Multipass installer
        run: python scripts/vendor_multipass.py --platform "${{ matrix.multipass-platform }}" --arch "${{ matrix.multipass-arch }}"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build provider desktop installer
        run: npm --workspace @golem/provider-desktop run tauri:build
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build macOS pkg with Multipass
        if: ${{ runner.os == 'macOS' }}
        run: python scripts/package_provider_desktop_macos.py
        env:
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}

      - name: Stage provider desktop release assets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const target = process.env.PROVIDER_DESKTOP_TARGET;
          const bundleDir = path.join(
            "apps",
            "provider-desktop",
            "src-tauri",
            "target",
            "release",
            "bundle",
          );
          const outDir = path.join("apps", "provider-desktop", "release-assets");
          const releaseExtensions = new Set([
            ".AppImage",
            ".deb",
            ".dmg",
            ".exe",
            ".msi",
            ".pkg",
            ".rpm",
          ]);

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const entryPath = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(entryPath) : [entryPath];
            });
          }

          fs.rmSync(outDir, { recursive: true, force: true });
          fs.mkdirSync(outDir, { recursive: true });

          const assets = walk(bundleDir).filter((file) =>
            releaseExtensions.has(path.extname(file)),
          );

          if (assets.length === 0) {
            throw new Error(`No release assets found in ${bundleDir}`);
          }

          for (const asset of assets) {
            const parsed = path.parse(asset);
            const destination = path.join(
              outDir,
              `${parsed.name}-${target}${parsed.ext}`,
            );
            fs.copyFileSync(asset, destination);
            console.log(destination);
          }
          NODE
        env:
          PROVIDER_DESKTOP_TARGET: ${{ matrix.target }}

      - name: Upload provider desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: provider-desktop-${{ matrix.target }}
          path: apps/provider-desktop/release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || (github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref)) }}

      - name: Determine tag/version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#provider-desktop-v}"
          else
            VERSION=$(node -p "require('./apps/provider-desktop/package.json').version")
            TAG="provider-desktop-v${VERSION}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download provider desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: provider-*
          path: release-artifacts

      - name: Verify release assets
        shell: bash
        run: |
          find release-artifacts -type f \( \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.AppImage' -o \
            -name '*.exe' -o \
            -name '*.msi' -o \
            -name '*.dmg' -o \
            -name '*.pkg' \
          \) -print | sort > /tmp/provider-desktop-release-assets.txt

          if [ ! -s /tmp/provider-desktop-release-assets.txt ]; then
            echo "No provider desktop installer assets were downloaded." >&2
            exit 1
          fi

          for asset in \
            golem-provider-cli-linux-x86_64 \
            golem-provider-cli-macos-arm64 \
            golem-provider-cli-windows-x86_64.exe
          do
            if ! find release-artifacts -type f -name "$asset" -print -quit | grep -q .; then
              echo "Missing provider CLI release asset: $asset" >&2
              exit 1
            fi
          done

          find release-artifacts -type f -name 'golem-provider-cli-*' -print | sort > /tmp/provider-cli-release-assets.txt

          {
            echo "### Provider desktop release assets"
            sed 's#^#- #' /tmp/provider-desktop-release-assets.txt
            echo
            echo "### Provider CLI release assets"
            sed 's#^#- #' /tmp/provider-cli-release-assets.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release checksums
        shell: bash
        run: |
          checksums="release-artifacts/checksums.txt"
          find release-artifacts -type f ! -name checksums.txt -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                sha256sum "$file" | awk -v name="$(basename "$file")" '{print $1 "  " name}'
              done > "$checksums"

          {
            echo
            echo "### Release checksums"
            sed 's#^#- #' "$checksums"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: Golem Provider Desktop ${{ steps.meta.outputs.VERSION }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
