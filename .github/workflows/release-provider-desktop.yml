name: Build and Release Provider Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or ref to build (e.g., provider-desktop-v0.1.0)"
        required: false
        type: string
      ref:
        description: "Commit SHA or branch to build if no tag provided"
        required: false
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "provider-desktop-v*"
  workflow_run:
    workflows: ["Auto Bump & Tag Provider Desktop"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-13
            target: mac-x64
          - os: macos-14
            target: mac-arm64
          - os: windows-latest
            target: win

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || (github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref)) }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install provider dependencies
        run: poetry -C provider-server install --no-interaction --no-ansi

      - name: Install PyInstaller
        run: poetry -C provider-server run pip install pyinstaller

      - name: Build and stage provider sidecar
        run: poetry -C provider-server run python ../scripts/build_provider_cli.py --onefile

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build provider desktop installer
        run: npm --workspace @golem/provider-desktop run tauri:build
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload provider desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: provider-desktop-${{ matrix.target }}
          path: |
            apps/provider-desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref) }}

      - name: Determine tag/version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#provider-desktop-v}"
          else
            VERSION=$(node -p "require('./apps/provider-desktop/package.json').version")
            TAG="provider-desktop-v${VERSION}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: Golem Provider Desktop ${{ steps.meta.outputs.VERSION }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
