name: Auto Bump & Tag Provider Desktop

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump type (patch|minor|major)"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
  push:
    branches: [main]
    paths:
      - "apps/provider-desktop/**"
      - "packages/design-system/**"
      - "packages/ui/**"
      - "provider-server/**"
      - "scripts/build_provider_cli.py"

jobs:
  bump_and_tag:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute and bump desktop version
        id: bump
        run: |
          node -e '
            const fs=require("fs");
            const files=["apps/provider-desktop/package.json", "apps/provider-desktop/src-tauri/tauri.conf.json"];
            const pkgPath=files[0];
            const pkg=JSON.parse(fs.readFileSync(pkgPath));
            const type=(process.env.RELEASE_TYPE||"patch").toLowerCase();
            const v=(pkg.version||"0.1.0").split(".").map(n=>parseInt(n||0,10));
            if(type==="major"){v[0]++; v[1]=0; v[2]=0;} else if(type==="minor"){v[1]++; v[2]=0;} else {v[2]++;}
            const version=v.join(".");
            pkg.version=version;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2)+"\n");
            const tauri=JSON.parse(fs.readFileSync(files[1]));
            tauri.version=version;
            fs.writeFileSync(files[1], JSON.stringify(tauri, null, 2)+"\n");
            console.log("NEW_VERSION="+version);
          ' >> $GITHUB_OUTPUT
        env:
          RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'patch' }}

      - name: Configure git user
        run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name "GitHub Actions"

      - name: Commit version bump
        run: |
          ver=${{ steps.bump.outputs.NEW_VERSION }}
          git add apps/provider-desktop/package.json apps/provider-desktop/src-tauri/tauri.conf.json
          git commit -m "provider-desktop: release v$ver [skip ci]" || echo "No changes to commit"

      - name: Push commit
        run: git push origin HEAD:main

      - name: Create and push tag
        id: tag
        run: |
          ver=${{ steps.bump.outputs.NEW_VERSION }}
          tag="provider-desktop-v$ver"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; skipping"
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git tag -a "$tag" -m "Golem Provider Desktop $ver"
          git push origin "$tag"
          echo "created=true" >> $GITHUB_OUTPUT

      - name: Dispatch release workflow
        if: steps.tag.outputs.created == 'true'
        run: |
          ver=${{ steps.bump.outputs.NEW_VERSION }}
          tag="provider-desktop-v$ver"
          gh workflow run release-provider-desktop.yml --ref "$tag" -f tag="$tag"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
