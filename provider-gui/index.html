<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Golem Provider GUI</title>
    <style>
        body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; padding: 16px; color: #222; background:#f7f8fb; }
        h1 { margin: 0 0 12px 0; font-size: 20px; }
        h2 { margin: 0 0 8px 0; font-size: 15px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; background: #fff; }
        .wide { grid-column: span 2; }
        .muted { color: #666; font-size: 12px; }
        #controls { margin: 12px 0; }
        #controls button { margin-right: 8px; padding: 8px 12px; }
        #status { font-weight: 600; }
        .ok { color: #0a7a26; }
        .warn { color: #a56600; }
        .err { color: #a11; }
        .section { margin-top: 16px; }
        .vm-list { border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; }
        .vm-row { display: grid; grid-template-columns: 24px 1fr 120px 170px 170px; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #eee; }
        .vm-row:last-child { border-bottom: 0; }
        .vm-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #eee; }
        .pill.running { background: #e6f7ed; color: #0a7a26; }
        .pill.stopped { background: #fdeaea; color: #a11; }
        .pill.warn { background:#fff7e6; color:#7a5100; }
        .pill.critical { background:#fdeaea; color:#a11; }
        .small { font-size: 12px; color: #555; }
        .metric { font-size: 22px; font-weight: 650; margin-top: 4px; }
        .bar { height: 6px; background:#edf0f5; border-radius: 999px; overflow: hidden; margin-top: 8px; }
        .bar > span { display:block; height:100%; background:#181E9F; }
        .alert-row { display:grid; grid-template-columns: 90px 1fr 110px; gap:8px; padding:8px 0; border-bottom:1px solid #eee; }
        .alert-row:last-child { border-bottom:0; }
        .tabs { display:flex; gap:8px; margin:16px 0 8px; }
        .tab { border:1px solid #d6d9e0; background:#fff; padding:7px 10px; border-radius:6px; cursor:pointer; }
        .tab.active { background:#181E9F; color:white; border-color:#181E9F; }
        .hidden { display:none; }
        .webhook-form { display:flex; gap:8px; margin-top:8px; }
        .webhook-form input { padding:8px; border:1px solid #d6d9e0; border-radius:6px; }
        .webhook-form input[type=text] { flex:1; }
    </style>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* http://localhost:* https://*">
</head>
<body>
    <h1>Golem Provider</h1>
    <div id="banner" style="display:none;padding:8px 12px;margin:10px 0;border:1px solid #f0c36d;background:#fff7e6;border-radius:6px;color:#7a5100"></div>

    <div class="grid">
      <div class="card">
        <div class="muted">Status</div>
        <div id="status" class="ok">Running</div>
        <div class="muted" id="env"></div>
      </div>
      <div class="card">
        <div class="muted">Resources (available / total)</div>
        <div id="resources"></div>
      </div>
      <div class="card">
        <div class="muted">Pricing (per month)</div>
        <div id="pricing"></div>
      </div>
      <div class="card">
        <div class="muted">Host CPU</div>
        <div class="metric" id="hostCpu">—</div>
        <div class="bar"><span id="hostCpuBar" style="width:0%"></span></div>
      </div>
      <div class="card">
        <div class="muted">Host Memory</div>
        <div class="metric" id="hostMemory">—</div>
        <div class="bar"><span id="hostMemoryBar" style="width:0%"></span></div>
      </div>
      <div class="card">
        <div class="muted">Host Disk</div>
        <div class="metric" id="hostDisk">—</div>
        <div class="bar"><span id="hostDiskBar" style="width:0%"></span></div>
      </div>
    </div>

    <div id="controls">
      <button id="stopBtn">Stop Provider</button>
      <button id="startBtn">Start Provider</button>
      <span class="muted small" id="actionMsg"></span>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="vmsPanel">VMs</button>
      <button class="tab" data-tab="alertsPanel">Alerts</button>
      <button class="tab" data-tab="integrationsPanel">Integrations</button>
    </div>

    <div class="section" id="vmsPanel">
      <h2>Virtual Machines</h2>
      <div class="vm-list" id="vmList"></div>
    </div>

    <div class="section hidden" id="alertsPanel">
      <h2>Alerts</h2>
      <div class="card" id="alertsList"></div>
    </div>

    <div class="section hidden" id="integrationsPanel">
      <h2>Webhooks</h2>
      <div class="card">
        <div class="muted">Send alert events to an HTTPS endpoint.</div>
        <div class="webhook-form">
          <input type="text" id="webhookName" placeholder="Name">
          <input type="text" id="webhookUrl" placeholder="https://example.com/webhook">
          <button id="webhookAdd">Add</button>
        </div>
        <div id="webhookList" style="margin-top:12px"></div>
      </div>
    </div>

    <!-- Link to the renderer script -->
    <script src="./renderer.js"></script>
</body>
</html>
